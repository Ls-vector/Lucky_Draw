<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:40px}
textarea{width:90%;height:150px;margin:10px}
button{padding:10px 20px;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<h2>Firebase Setup (Improved)</h2>

<textarea id="configInput" placeholder="Paste Firebase config here..."></textarea>
<br>
<button onclick="initFirebase()">Connect</button>

<script>
let db;

function parseConfig(raw){
  try {
    // Try JSON first
    return JSON.parse(raw);
  } catch(e) {
    try {
      // Fallback to JS object
      return new Function('return ' + raw)();
    } catch(err) {
      throw new Error('Invalid format');
    }
  }
}

function validateConfig(config){
  const required = ['apiKey','authDomain','databaseURL','projectId'];
  for(let key of required){
    if(!config[key]){
      throw new Error(`Missing field: ${key}`);
    }
  }
}

function initFirebase(){
  const raw = document.getElementById('configInput').value.trim();

  if(!raw){
    alert('Paste config first');
    return;
  }

  let config;
  try{
    config = parseConfig(raw);
    validateConfig(config);
  }catch(e){
    alert('❌ Error: ' + e.message);
    return;
  }

  try{
    firebase.initializeApp(config);
    db = firebase.database();
    alert('✅ Firebase Connected Successfully');
  }catch(e){
    alert('Firebase Error: ' + e.message);
  }
}
</script>

</body>
</html>
