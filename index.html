<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Pro</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{font-family:Arial;background:#0d0d0d;color:#fff;text-align:center;padding:20px}
input{padding:10px;margin:5px;width:200px}
button{padding:10px 20px;margin:10px;cursor:pointer}
#winner{font-size:40px;margin:30px;color:gold}
</style>
</head>
<body>

<h1>🎰 Lucky Draw Pro</h1>

<div>
<input id="nameInput" placeholder="Add participant">
<button onclick="addName()">Add</button>
</div>

<div>
<input id="prizeInput" placeholder="Add prize">
<button onclick="addPrize()">Add</button>
</div>

<button onclick="drawWinner()">🎯 Draw Winner</button>

<h2 id="winner">Waiting...</h2>

<script>


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBKMryvAUR4SOCWcl8P8JfGexZNSejD_E8",
  authDomain: "rafale-draw.firebaseapp.com",
  projectId: "rafale-draw",
  storageBucket: "rafale-draw.firebasestorage.app",
  messagingSenderId: "278599574531",
  appId: "1:278599574531:web:1016ea3f9f79f526151a36",
  measurementId: "G-ZZW368S4YF"
};


  
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();

let names = [];
let prizes = [];

// ADD NAME
function addName(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val) return;
  names.push(val);
  db.ref('data/names').set(names);
  document.getElementById('nameInput').value='';
}

// ADD PRIZE
function addPrize(){
  const val = document.getElementById('prizeInput').value.trim();
  if(!val) return;
  prizes.push(val);
  db.ref('data/prizes').set(prizes);
  document.getElementById('prizeInput').value='';
}

// DRAW
function drawWinner(){
  if(names.length===0) return alert('No participants');
  const winner = names[Math.floor(Math.random()*names.length)];
  const prize = prizes.length ? prizes[Math.floor(Math.random()*prizes.length)] : 'Prize';

  db.ref('draw').set({winner, prize, time:Date.now()});
}

// LISTEN LIVE
firebase.database().ref('data').on('value', snap=>{
  const d = snap.val();
  if(!d) return;
  names = d.names || [];
  prizes = d.prizes || [];
});

firebase.database().ref('draw').on('value', snap=>{
  const d = snap.val();
  if(!d) return;

  const el = document.getElementById('winner');
  el.innerText = '🎉 ' + d.winner + ' → ' + d.prize;

  confetti({particleCount:150,spread:70});
});

</script>

</body>
</html>
